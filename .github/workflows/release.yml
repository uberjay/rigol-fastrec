name: Release

# Cut a GitHub Release when a v* tag is pushed: build the wheel + sdist and
# attach them, using the matching CHANGELOG.md section as the body.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for `gh release create`

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -oP '__version__\s*=\s*"\K[^"]+' python/rigol_fastrec/__init__.py)
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          fi

      - name: Run offline tests
        run: |
          python -m pip install --upgrade pip
          pip install -e "python[dev]"
          python -m pytest python

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build python

      - name: Extract CHANGELOG section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG.md entry for $ver" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            python/dist/*
