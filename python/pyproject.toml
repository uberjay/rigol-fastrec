[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rigol-fastrec"
dynamic = ["version"]            # single-sourced from rigol_fastrec/__init__.py
description = "Use a Rigol MHO900-series scope as a fast streaming ADC: WaveRecord readback over LAN via a Frida agent."
readme = "../README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Joshua Huber" }]
keywords = ["rigol", "oscilloscope", "mho900", "frida", "side-channel", "waverecord", "fast-record"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX",
]
dependencies = [
    "numpy>=1.24",
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",
    "frida>=17,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/uberjay/rigol-fastrec"
Repository = "https://github.com/uberjay/rigol-fastrec"

[tool.hatch.version]
path = "rigol_fastrec/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["rigol_fastrec"]
# The built Frida agent bundle (rigol_fastrec/_agent.js) is committed and ships
# as package data, so installs need no Node toolchain. `npm run build` (or
# `make build`) regenerates it in place; the runtime loader raises a clear error
# if it's somehow absent.

[tool.pytest.ini_options]
testpaths = ["tests"]
